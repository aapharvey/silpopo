<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3d2b">
  <title>Кошик · списки й акції</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">◐</span> Кошик</div>
    <div id="status" class="status"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Розділи">
    <a href="#/" data-tab="lists"><span>🧺</span>Списки</a>
    <a href="#/deals" data-tab="deals"><span>🏷️</span>Вигідно</a>
    <a href="#/settings" data-tab="settings"><span>⚙️</span>Налаштування</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body" role="dialog" aria-modal="true"><div id="sheet-content"></div></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
